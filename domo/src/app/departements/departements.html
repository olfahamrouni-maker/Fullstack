<div class="container mt-4">
  <h3 class="text-center">Liste des départements</h3>
    <div class="text-end mt-3">
    <button class="btn btn-success">
        <i class="bi bi-plus"></i>
    </button>
    </div>

  @if(errorMessage){
  <div class="alert alert-danger text-center">{{ errorMessage }}</div>
  }
  @else {
  <table class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom du département</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
        @for (dep of departements | paginate: { itemsPerPage: 5, currentPage: p }; track $index){
            <tr>
                <td>{{ dep.id }}</td>
                <td>{{ dep.nom }}</td>
                <td class="text-center">
                <!-- Éditer -->
                <button class="btn btn-sm btn-outline-primary me-2" title="Éditer">
                    <i class="bi bi-pencil"></i>
                </button>

                <!-- Supprimer -->
                <button class="btn btn-sm btn-outline-danger me-2" title="Supprimer">
                    <i class="bi bi-trash"></i>
                </button>

                <!-- Liste / Voir employés -->
                <button class="btn btn-sm btn-outline-info" title="Voir la liste">
                    <i class="bi bi-list"></i>
                </button>
                </td>
            </tr>
        }
    </tbody>
  </table>
  <pagination-controls 
    (pageChange)="p = $event"
    previousLabel="Précédent"
    nextLabel="Suivant"
    class="d-flex justify-content-center">
  </pagination-controls>
  }
</div>
